format = """
[ ◤ ](bg:#1a0a2e fg:#A60AEB)\
[◢ ](bg:#0a0a1a fg:#00FFFF)\
[](bg:#191724 fg:#EB6F92)\
$directory\
[](fg: #F6C177 bg:#191724)\
$git_branch\
[](fg: #ebbcba bg: #191724)\
$git_status\
[](fg:#2e6b85 bg:#191724)\
$nodejs\
$rust\
$golang\
$php\
$python\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#F6c177 bg:#191724"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "


[git_branch]
symbol = ""
style = "bg:#191724"
format = '[[ $symbol $branch ](fg:#ebbcba bg:#191724)]($style)'

[git_status]
style = "bg:#191724"
format = '[[($all_status$ahead_behind )](fg:#ebbcba bg:#191724)]($style)'

[nodejs]
symbol = ""
style = "bg:#191724"
format = '[[ $symbol ($version) ](fg:#2e6b85 bg:#191724)]($style)'

[rust]
symbol = ""
style = "bg:#191724"
format = '[[ $symbol ($version) ](fg:#2e6b85 bg:#191724)]($style)'

[golang]
symbol = ""
style = "bg:#191724"
format = '[[ $symbol ($version) ](fg:#2e6b85 bg:#191724)]($style)'

[php]
symbol = ""
style = "bg:#191724"
format = '[[ $symbol ($version) ](fg:#2e6b85 bg:#191724)]($style)'

[python]
symbol = ""
style = "bg:#191724"
format = '[[ $symbol ($version) ](fg:#2e6b85 bg:#191724)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#CECCE1 bg:#1d2230)]($style)'
